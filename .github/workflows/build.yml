name: Build Vanth base (Apollon)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'   # AGP 7.0.2 pide JDK 11

      - uses: android-actions/setup-android@v3

      - name: SDK y NDK
        run: sdkmanager "platforms;android-30" "build-tools;30.0.3" "ndk;21.4.7075529"

      - name: Compilar
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/21.4.7075529
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: vanth-base-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/intermediates/**/lib/**/*.so
          if-no-files-found: warn
